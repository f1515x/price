name: Calculate Price

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 4 * * *"
    - cron: "0 8 * * *"
    - cron: "0 12 * * *"
    - cron: "0 16 * * *"
    - cron: "0 20 * * *"
  push:
    branches:
      - main
    paths:
      - "*.py"
      - "src/**"
      - "pyproject.toml"
      - "config/symbols.txt"
      - "config/chat_ids.txt"
      - "requirements.txt"
      - ".github/workflows/run.yml"

permissions:
  contents: write

concurrency:
  group: calculate-price
  cancel-in-progress: true

jobs:
  calculate-price:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up latest Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Read symbols and calculate sizes
        shell: bash
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
        run: |
          set -o pipefail

          mapfile -t symbols < <(sed -e 's/\r$//' -e '/^[[:space:]]*$/d' config/symbols.txt)

          if [ "${#symbols[@]}" -eq 0 ]; then
            echo "config/symbols.txt does not contain any symbols." >&2
            exit 1
          fi

          mkdir -p data reports
          price-monitor precision "${symbols[@]}"

          price-monitor sizes "${symbols[@]}" \
            | sed '/^[[:space:]]*none[[:space:]]*$/d' \
            | tee reports/sizes.txt

          printf '\nOrders Times: %s \n' "$(date +%s%3N)" \
            | tee -a reports/sizes.txt


      - name: Send calculated sizes to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: price-monitor notify reports/sizes.txt config/chat_ids.txt

      - name: Commit generated files
        shell: bash
        run: |
          if git diff --quiet -- reports/sizes.txt data/price_steps.json \
             && [ -z "$(git ls-files --others --exclude-standard -- reports/sizes.txt data/price_steps.json)" ]; then
            echo "Generated files are unchanged; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sizes.txt data/price_steps.json
          git commit -m "chore: update calculated prices"
          git push
