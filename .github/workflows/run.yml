name: Calculate Price

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 4 * * *"
    - cron: "0 8 * * *"
    - cron: "0 12 * * *"
    - cron: "0 16 * * *"
    - cron: "0 20 * * *"
  push:
    branches:
      - main
      - "feature/**"
      - "feature-*"
    paths:
      - "*.py"
      - "src/**"
      - "pyproject.toml"
      - "config/symbols.txt"
      - "config/chat_ids.txt"
      - "requirements.txt"
      - ".github/workflows/run.yml"
      - "scripts/commit_generated_files.sh"

permissions:
  contents: write

concurrency:
  group: calculate-price-${{ github.ref }}
  cancel-in-progress: false

jobs:
  calculate-price:
    # Feature pushes run offline PR checks, without publishing live reports.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up latest Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Read symbols and calculate sizes and signals
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail

          mapfile -t symbols < <(sed -e 's/\r$//' -e '/^[[:space:]]*$/d' config/symbols.txt)

          if [ "${#symbols[@]}" -eq 0 ]; then
            echo "config/symbols.txt does not contain any symbols." >&2
            exit 1
          fi

          mkdir -p data reports
          price-monitor precision "${symbols[@]}"

          price-monitor sizes "${symbols[@]}" \
            | sed '/^[[:space:]]*none[[:space:]]*$/d' \
            | tee reports/sizes.txt

          printf '\nTimestamp: %s \n' "$(date +%s%3N)" \
            | tee -a reports/sizes.txt

          price-monitor signals "${symbols[@]}" | tee reports/signals.txt


      - name: Write calculated sizes to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE || 'orders' }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python supabase.py --sizes-file reports/sizes.txt --minimal

      - name: Send calculated sizes to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: price-monitor notify reports/sizes.txt config/chat_ids.txt

      - name: Commit generated files
        shell: bash
        env:
          REPORT_BRANCH: ${{ github.ref_name }}
        run: bash scripts/commit_generated_files.sh "$REPORT_BRANCH"
