[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "price-monitor"
version = "0.1.0"
description = "Gate.io market signals and position size monitoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "requests"]

[project.scripts]
price-monitor = "price_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
